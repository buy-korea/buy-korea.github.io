<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b3d2e" />
  <title>Buy Korea</title>
  <meta name="description" content="Shop Korean merchandise, collectibles, and lifestyle goods with secure PayPal checkout." />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">Buy Korea</a>
    <div class="auth-actions">
      <span id="user-label" class="muted"></span>
      <button id="login-button" class="button secondary">Sign in with Google</button>
      <button id="logout-button" class="button secondary hidden">Sign out</button>
    </div>
  </header>

  <main class="page-shell">
    <section id="home-view">
      <div class="hero">
        <p class="eyebrow">Korean merchandise, simply</p>
        <h1>Find something worth keeping.</h1>
        <p>Discover merchandise, collectibles, and lifestyle goods. Sign in with Google and pay securely through PayPal.</p>
      </div>
      <div id="product-grid" class="product-grid" aria-live="polite"></div>
      <div id="empty-state" class="empty-state hidden">No products are available yet.</div>
    </section>

    <section id="product-view" class="hidden" aria-live="polite">
      <a href="/" class="back-link">← Back to products</a>
      <div id="product-detail" class="product-detail"></div>
    </section>

    <section id="status-view" class="status-box hidden" aria-live="polite"></section>
  </main>

  <footer class="site-footer">
    <span>Secure checkout powered by PayPal.</span>
    <a href="/admin/">Admin</a>
  </footer>

  <script type="module" src="/app.js"></script>
</body>
</html>
